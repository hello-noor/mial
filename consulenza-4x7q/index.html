<style>
/* Layout: app mobile a schermo intero. Intestazione compatta, contenuto in schede, barra di navigazione fissa in basso. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F5F6F8; --ink:#101828; --muted:#667085; --line:#E4E7EC;
  --sede:#2E5BFF; --sede-soft:#E8EEFF; --on-sede:#FFFFFF;
  --smart:#E4570B; --smart-soft:#FFEFE3; --on-smart:#FFFFFF;
  --ok:#067647; --ok-soft:#DCFAE6; --err-soft:#FEE4E2; --danger:#D92D20;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
  --nav-bg:rgba(255,255,255,.86);
  --display:'Bricolage Grotesque','SF Pro Display',system-ui,sans-serif;
  --body:'Figtree','SF Pro Text',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0E15; --surface:#141A24; --surface-2:#1B2230; --ink:#F2F4F7; --muted:#98A2B3; --line:#263042;
    --sede:#7C9CFF; --sede-soft:#1A2550; --on-sede:#0A0E15;
    --smart:#FF9A52; --smart-soft:#3A2414; --on-smart:#1A0E05;
    --ok:#47CD89; --ok-soft:#0F2E1F; --err-soft:#3A1715; --danger:#F97066;
    --shadow:0 0 0 1px rgba(255,255,255,.04); --nav-bg:rgba(20,26,36,.86); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0E15; --surface:#141A24; --surface-2:#1B2230; --ink:#F2F4F7; --muted:#98A2B3; --line:#263042;
  --sede:#7C9CFF; --sede-soft:#1A2550; --on-sede:#0A0E15;
  --smart:#FF9A52; --smart-soft:#3A2414; --on-smart:#1A0E05;
  --ok:#47CD89; --ok-soft:#0F2E1F; --err-soft:#3A1715; --danger:#F97066;
  --shadow:0 0 0 1px rgba(255,255,255,.04); --nav-bg:rgba(20,26,36,.86); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s ease,background-color .15s ease}
button:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--sede);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:640px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(104px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}

/* Intestazione */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:6px 2px 2px}
.kicker{margin:0 0 2px;font-size:13px;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:32px;line-height:1.05;margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--display);font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.tools{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.ghost{background:var(--surface-2);border:0;border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink)}

/* Schede */
.card{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card-h span{font-size:13px;color:var(--muted);font-weight:500}
.cards{display:grid;grid-template-columns:1fr;gap:16px}
.sub{margin:0;font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.link{background:none;border:0;color:var(--sede);font-weight:700;font-size:14px;padding:4px}
.hint{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* Segmented control */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border-radius:14px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:11px;padding:11px 10px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{background:var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{background:var(--line)}}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.rec{padding:14px;gap:16px}

/* Pulsanti timbratura */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{border:0;border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:140px;font-weight:700;font-size:19px;font-family:var(--display);letter-spacing:-.01em;position:relative;overflow:hidden}
.big small{display:block;font-family:var(--body);font-weight:500;font-size:13px;opacity:.85;letter-spacing:0;margin-top:2px}
.big svg{width:24px;height:24px;padding:10px;box-sizing:content-box;background:rgba(255,255,255,.2);border-radius:14px}
.big.sede{background:linear-gradient(150deg,#3D69FF,#1E3CC8);color:#fff}
.big.smart{background:linear-gradient(150deg,#F2711F,#C2410C);color:#fff}

/* Timer ad anello */
.clockwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:4px}
.ringbox{position:relative;width:200px;height:200px}
.ringbox svg{width:200px;height:200px;transform:rotate(-90deg)}
.ringbox .track{stroke:var(--surface-2)}
.ringbox .prog{transition:stroke-dashoffset .6s ease}
.ringbox .prog.sede{stroke:var(--sede)} .ringbox .prog.smart{stroke:var(--smart)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.timer{font-family:var(--display);font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.ringtxt span{font-size:12px;color:var(--muted);font-weight:600}
.clockmeta{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.clockwrap .actions{width:100%}

/* Stato posizione */
.gbox{border-radius:14px;padding:11px 14px;font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:8px;width:100%}
.gbox.ok{background:var(--ok-soft);color:var(--ok)}.gbox.warn{background:var(--smart-soft);color:var(--ink)}.gbox.err{background:var(--err-soft);color:var(--ink)}.gbox.wait{background:var(--surface-2);color:var(--muted)}
.gbox button{align-self:flex-start;background:var(--surface)}

/* Settimana e totali */
.lab{display:flex;align-items:center;gap:8px;font-weight:600}
.lab svg{width:18px;height:18px}
.lab.sede{color:var(--sede)} .lab.smart{color:var(--smart)}
.pips{display:flex;gap:6px;align-items:center}
.pip{width:20px;height:20px;border-radius:7px;background:var(--surface-2)}
.pip.on.sede{background:var(--sede)} .pip.on.smart{background:var(--smart)}
.count{font-variant-numeric:tabular-nums;font-weight:700;min-width:56px;text-align:right}
.count small{color:var(--muted);font-weight:500}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sede),var(--smart));border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;background:var(--surface-2);border-radius:14px;padding:10px 12px}
.stat b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--muted);font-weight:500}
.stats.exp .stat b{font-size:17px}

/* Calendario */
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-nav .btns{display:flex;gap:6px;align-items:center}
.sq{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface-2);font-size:18px;font-weight:700;display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding:2px 0 6px}
.cell{height:46px;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.cell:hover{background:var(--surface-2)}
.cell.we{color:var(--muted)}
.cell.today{background:var(--ink);color:var(--surface)}
.cell.blank{visibility:hidden}
.dots{display:flex;gap:3px;min-height:6px}
.dot{width:6px;height:6px;border-radius:50%}
.dot.sede{background:var(--sede)} .dot.smart{background:var(--smart)}
.cell.today .dot{box-shadow:0 0 0 1.5px var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;font-weight:500}
.legend span{display:flex;align-items:center;gap:6px}

/* Chip */
.chips,.presets{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* Elenco giornate e spese */
.list{display:flex;flex-direction:column;gap:10px}
.item{position:relative;overflow:hidden;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:18px;padding:12px 14px 12px 16px;width:100%;color:var(--ink)}
.item::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--line)}
.item.sede::before{background:var(--sede)} .item.smart::before{background:var(--smart)} .item.exp::before{background:var(--ink)}
.dnum{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;background:var(--surface-2);border-radius:12px;height:48px}
.dnum b{font-family:var(--display);font-size:20px}
.dnum span{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-top:3px;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px}
.pill.sede{background:var(--sede-soft);color:var(--sede)} .pill.smart{background:var(--smart-soft);color:var(--smart)}
.pill.cat{background:var(--surface-2);color:var(--ink)} .pill.bill{background:var(--sede-soft);color:var(--sede)}
.item .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.item .t .when{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.item .t .note{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .h{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.note.geo{font-size:12px}.note.geo.ok{color:var(--ok);font-weight:600}
.tag{font-size:11px;font-weight:600;background:var(--surface-2);border-radius:99px;padding:2px 8px;color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:24px 18px;text-align:center;color:var(--muted);font-size:14px}

/* Tabella mensile */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:10px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
tfoot td{font-weight:700;border-bottom:0}

/* Moduli */
.qf{display:flex;flex-direction:column;gap:12px}
.fblock{background:var(--surface-2);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.fblock .field input,.fblock .field select,.fblock .field textarea{background:var(--surface)}
.fblock .sub{margin-top:2px}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qrow input[type=date]{flex:0 0 auto;width:150px;min-width:0;border:1.5px solid transparent;background:var(--surface);border-radius:12px;padding:10px 8px;min-height:44px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;font-size:15px;white-space:nowrap;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.seg button svg{width:20px;height:20px}
.seg button[aria-pressed="true"].sede{background:var(--sede);border-color:var(--sede);color:var(--on-sede)}
.seg button[aria-pressed="true"].smart{background:var(--smart);border-color:var(--smart);color:var(--on-smart)}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1.5px solid transparent;background:var(--surface-2);border-radius:12px;padding:11px 12px;width:100%;min-height:48px;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sede);background:var(--surface)}
.two{display:flex;gap:10px}
.dur{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.dur .err{color:var(--danger);font-size:14px;font-family:var(--body)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--ink);color:var(--surface);flex:1;min-height:50px;font-size:16px}
.btn.alt{background:var(--surface-2);color:var(--ink)}
.btn.del{background:transparent;color:var(--danger);border:1.5px solid color-mix(in srgb,var(--danger) 45%,transparent);flex:0 0 auto}
.save{border:0;border-radius:16px;padding:16px;font-weight:700;font-size:18px;font-family:var(--display);background:var(--ink);color:var(--surface);min-height:58px}
.save.sede{background:var(--sede);color:var(--on-sede)}.save.smart{background:var(--smart);color:var(--on-smart)}
textarea.out{min-height:240px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.bk{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.manual{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);flex-wrap:wrap}

/* Fogli (modali) */
.scrim{position:fixed;inset:0;background:rgba(10,14,21,.5);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:30;animation:fade .18s ease}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 4px;flex:none}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@keyframes fade{from{opacity:0}}

.bar-sede{fill:var(--sede)}.bar-smart{fill:var(--smart)}.bar-tot{fill:var(--sede);opacity:.28}.bar-bill{fill:var(--sede)}
.tline{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.grid{stroke:var(--line);stroke-width:1}
.axis{fill:var(--muted);font-size:10px;font-family:var(--body);font-weight:600}
.lsede,.lsmart{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.lsede{stroke:var(--sede)}.lsmart{stroke:var(--smart)}
.lexp{fill:none;stroke-width:1.5;stroke-dasharray:5 5;opacity:.7}
.lexp.sede{stroke:var(--sede)}.lexp.smart{stroke:var(--smart)}
.pill.neu{background:var(--surface-2);color:var(--muted)}
.curcol{fill:var(--surface-2)}
.axis.cur{fill:var(--ink)}.axis.val{fill:var(--ink)}.axis.tlab{fill:var(--ink)}
.todayline{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3;opacity:.45}
.pt-sede{fill:var(--sede);stroke:var(--surface);stroke-width:2}.pt-smart{fill:var(--smart);stroke:var(--surface);stroke-width:2}
.hero{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.hero b{font-family:var(--display);font-size:20px;letter-spacing:-.01em}.hero span{font-size:14px}
.hero.ok{background:var(--ok-soft);color:var(--ok)}.hero.ok span{color:var(--ink)}
.hero.warn{background:var(--smart-soft);color:var(--smart)}.hero.warn span{color:var(--ink)}
.hero.neu{background:var(--surface-2);color:var(--ink)}
.goal{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.gbar{position:relative;height:10px;background:var(--surface-2);border-radius:99px}
.gbar i{display:block;height:100%;border-radius:99px}.gbar i.sede{background:var(--sede)}.gbar i.smart{background:var(--smart)}
.gbar u{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--ink);border-radius:2px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--smart-soft);color:var(--smart)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.srowt{display:flex;flex-direction:column;gap:2px;min-width:0}
.catlist{display:flex;flex-direction:column;gap:12px}
.catrow{display:grid;grid-template-columns:92px 1fr 86px;gap:10px;align-items:center;font-size:14px}
.catname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.catrow b{text-align:right;display:flex;flex-direction:column;line-height:1.2;font-variant-numeric:tabular-nums}
.catrow b small{color:var(--muted);font-weight:600;font-size:11px}
.catbar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.catbar i{display:block;height:100%;background:var(--sede);border-radius:99px}
/* Barra di navigazione */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav-bg);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(12px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom))}
.nav-in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:460px}

<body>
<div id="app"><p class="noscript">Caricamento…</p></div>
<script id="state" type="application/json">{"updated":0,"settings":{"startDate":"2026-11-01","endDate":"2027-01-31","targetSede":1,"targetSmart":1,"rate":0},"entries":[]}</script>
<script>
(function(){
'use strict';
var LS='massini-tracker-v1';
var app=document.getElementById('app');
var state=JSON.parse(document.getElementById('state').textContent);
var toastTimer=null;
var tEl=document.createElement('div');tEl.className='toast';tEl.setAttribute('role','status');tEl.hidden=true;document.body.appendChild(tEl);

/* ---------- date e orari ---------- */
var DEFAULT_TAGS=['Audit','Riunione','Affiancamento marketing','Sales','Produzione','Sito web','Report','Formazione'];
var DEFAULT_CATS=['Software','Token AI','Viaggi','Formazione','Hardware','Altro'];
function normState(){var s=state.settings;state.expenses=state.expenses||[];if(!s.catsInit){s.cats=(s.cats&&s.cats.length)?s.cats:DEFAULT_CATS.slice();s.catsInit=true}s.cats=s.cats||[];if(!s.tagsInit){s.tags=(s.tags&&s.tags.length)?s.tags:DEFAULT_TAGS.slice();s.tagsInit=true}s.tags=s.tags||[];s.sites=s.sites||[];s.radius=+s.radius||250;if(!s.sitesInit){[{name:'Massini Bastia',lat:43.05281,lng:12.54444},{name:'Massini Tordandrea',lat:43.03847,lng:12.56242}].forEach(function(d){if(!s.sites.some(function(x){return x.name===d.name}))s.sites.push(d)});s.sitesInit=true}if(state.active&&state.active.gpend)state.active.gpend=false}
function saveQuiet(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function todayIso(){return iso(new Date())}
function mondayOf(s){var d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function toMin(t){var p=t.split(':').map(Number);return p[0]*60+p[1]}
function span(s,e){var a=toMin(s),b=toMin(e);if(b<a)b+=1440;return b-a}
function mins(e){return Math.max(0,span(e.start,e.end)-(+e.pause||0))}
function fmtH(m){var h=Math.floor(m/60),r=m%60;return r?h+'h '+pad(r):h+'h'}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function fmtMonth(y,m){return cap(new Intl.DateTimeFormat('it-IT',{month:'long',year:'numeric'}).format(new Date(y,m,1)))}
function fmtLong(s){return new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'long',year:'numeric'}).format(parse(s))}
function fmtShortMonth(s){return new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'short'}).format(parse(s))}
function fmtIt(s){var d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()}
function wd(s){return new Intl.DateTimeFormat('it-IT',{weekday:'short'}).format(parse(s))}
function gg(n){return n+(n===1?' giornata':' giornate')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var TYPE={sede:'In sede',smart:'Smart working'};

var ICON={
 sede:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16"/><path d="M14 10h5a1 1 0 0 1 1 1v10"/><path d="M8 8h2M8 12h2M8 16h2M3 21h18"/></svg>',
 smart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>'
};

/* ---------- statistiche ---------- */
function stats(list){
  var d={sede:{},smart:{}},m={sede:0,smart:0};
  list.forEach(function(e){d[e.type][e.date]=1;m[e.type]+=mins(e)});
  var s=Object.keys(d.sede).length,t=Object.keys(d.smart).length;
  return {sede:{days:s,min:m.sede},smart:{days:t,min:m.smart},days:s+t,min:m.sede+m.smart};
}
function sorted(list){return list.slice().sort(function(a,b){return a.date===b.date?(a.start<b.start?-1:1):(a.date<b.date?-1:1)})}

/* ---------- interfaccia ---------- */
function initialView(){
  var t=todayIso(),s=state.settings;
  var ref=t<s.startDate?s.startDate:(t>s.endDate?s.endDate:t);
  var d=parse(ref);return {y:d.getFullYear(),m:d.getMonth()};
}
var ui={view:initialView(),filter:'all',modal:null,form:null,sform:null,confirmDel:false,confirmDiscard:false,toast:'',backup:null};

try{
  var raw=localStorage.getItem(LS);
  if(raw){var b=JSON.parse(raw);if(b&&b.entries&&b.settings)state=b}
}catch(e){}
normState();
ui.view=initialView();
ui.mode=state.mode||'clock';
ui.q=newQ();
ui.page=({spese:'spese',registro:'registro',andamento:'andamento'})[state.page]||'oggi';
ui.e=newE();

function toast(msg,ms){
  tEl.textContent=msg;tEl.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){tEl.hidden=true},ms||2200);
}

function dist(a,b){var R=6371000,r=Math.PI/180,dl=(b.lat-a.la)*r,dn=(b.lng-a.lo)*r,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.la*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}
function getPos(){
  return new Promise(function(res){
    if(!navigator.geolocation){res({err:'unsupported'});return}
    navigator.geolocation.getCurrentPosition(function(p){res({la:+p.coords.latitude.toFixed(5),lo:+p.coords.longitude.toFixed(5),ac:Math.round(p.coords.accuracy)})},function(er){res({err:er&&er.code===1?'denied':(er&&er.code===3?'timeout':'unavailable')})},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  });
}
function fmtDist(m){return m>=1000?(m/1000).toFixed(1).replace('.',',')+' km':Math.round(m)+' m'}
function tagSite(g){
  if(!g||g.err)return g;
  var best=null,bd=1e12,s=state.settings;
  s.sites.forEach(function(x){var d=dist(g,x);if(d<bd){bd=d;best=x}});
  g.near=best?best.name:'';g.d=best?Math.round(bd):null;
  g.site=(best&&bd<=s.radius+Math.min(g.ac||0,100))?best.name:'';
  return g;
}
function geoWord(g){return g.site?esc(g.site)+' ✓':(state.settings.sites.length?'fuori sede':'salvata')}
function geoFormLine(f){var i=f.gin?geoWord(f.gin):'n.d.',o=f.gpend?'cerco…':(f.gout?geoWord(f.gout):(f.gerr?'non disponibile':'n.d.'));return 'Posizione · entrata: '+i+' · uscita: '+o}
function geoSum(e){if(!e.gin&&!e.gout)return '';return ' · pos. '+(e.gin?(e.gin.site||'fuori sede'):'n.d.')+'/'+(e.gout?(e.gout.site||'fuori sede'):'n.d.')}
function geoStatus(a){
  if(a.gpend)return {c:'wait',t:'Cerco la posizione…'};
  if(a.gin){
    var g=a.gin;
    if(g.site)return {c:'ok',t:'✓ In sede: '+esc(g.site)+(g.d!=null?' · a '+fmtDist(g.d):'')};
    if(state.settings.sites.length&&g.near)return {c:'warn',t:'Fuori sede. La più vicina è '+esc(g.near)+', a '+fmtDist(g.d)};
    return {c:'warn',t:'Posizione salvata (nessuna sede impostata)'};
  }
  var m={denied:'Permesso di posizione negato. Attivalo in Impostazioni di iOS → Privacy → Localizzazione.',timeout:'Posizione non rilevata in tempo.',unavailable:'Posizione non disponibile. Prova all’aperto.',unsupported:'Questo dispositivo non supporta la posizione.'};
  return {c:'err',t:m[a.gerr]||m.unavailable};
}
function activeGeo(a){
  if(a.gpend)return 'Cerco la posizione…';
  if(!a.gin)return 'Posizione non disponibile. Controlla il permesso di posizione.';
  if(a.gin.site)return 'Posizione verificata: '+esc(a.gin.site);
  return state.settings.sites.length?'Fuori dalle sedi salvate':'Posizione salvata';
}
function tagChips(sel,action){
  sel=sel||[];var all=state.settings.tags.slice();
  sel.forEach(function(t){if(all.indexOf(t)<0)all.push(t)});
  if(!all.length)return '';
  return '<div class="presets">'+all.map(function(t){return '<button type="button" class="chip" data-a="'+action+'" data-v="'+esc(t)+'" aria-pressed="'+(sel.indexOf(t)>=0)+'">'+esc(t)+'</button>'}).join('')+'</div>';
}
function toggleTag(list,t){var i=list.indexOf(t);if(i>=0)list.splice(i,1);else list.push(t)}
var EUR=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});
function eur(n){return EUR.format(n||0)}
function parseAmt(s){var t=String(s||'').replace(/[\s€]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');var n=parseFloat(t);return isFinite(n)?Math.round(n*100)/100:NaN}
function newE(){return {date:todayIso(),amount:'',cat:(state.settings.cats[0]||''),desc:'',bill:false}}
function catChips(cur,action){
  var all=state.settings.cats.slice();if(cur&&all.indexOf(cur)<0)all.push(cur);
  return '<div class="presets">'+all.map(function(c){return '<button type="button" class="chip" data-a="'+action+'" data-v="'+esc(c)+'" aria-pressed="'+(c===cur)+'">'+esc(c)+'</button>'}).join('')+'</div>';
}
function sumExp(list){var t=0,b=0;list.forEach(function(x){t+=x.amount;if(x.bill)b+=x.amount});return {tot:Math.round(t*100)/100,bill:Math.round(b*100)/100}}
function expItem(x){
  var d=parse(x.date);
  return '<button class="item exp" data-a="eedit" data-id="'+x.id+'"><div class="dnum"><b>'+d.getDate()+'</b><span>'+wd(x.date)+'</span></div>'
   +'<div class="t"><span><span class="pill cat">'+esc(x.cat||'Senza categoria')+'</span>'+(x.bill?' <span class="pill bill">Da fatturare</span>':'')+'</span>'+(x.desc?'<span class="when">'+esc(x.desc)+'</span>':'')+'</div>'
   +'<div class="h">'+eur(x.amount)+'</div></button>';
}
function spesePage(){
  var e=ui.e,t=todayIso(),y=addDays(t,-1);
  var form='<section class="card" aria-label="Nuova spesa"><h2>Nuova spesa</h2><div class="qf">'
   +'<div class="presets"><button type="button" class="chip" data-a="edate" data-v="'+t+'" aria-pressed="'+(e.date===t)+'">Oggi</button><button type="button" class="chip" data-a="edate" data-v="'+y+'" aria-pressed="'+(e.date===y)+'">Ieri</button></div>'
   +'<div class="two"><div class="field"><label for="e-date">Giorno</label><input id="e-date" type="date" data-e="date" value="'+e.date+'"></div><div class="field"><label for="e-amt">Importo (€)</label><input id="e-amt" type="text" inputmode="decimal" data-e="amount" placeholder="0,00" value="'+esc(e.amount)+'"></div></div>'
   +'<div class="field"><label>Categoria</label>'+catChips(e.cat,'ecat')+'</div>'
   +'<div class="field"><label for="e-desc">Descrizione</label><input id="e-desc" type="text" data-e="desc" placeholder="Es. Abbonamento Claude" value="'+esc(e.desc)+'"></div>'
   +'<div class="presets"><button type="button" class="chip" data-a="ebill" aria-pressed="'+e.bill+'">Da fatturare a Massini</button></div>'
   +'<button class="save" data-a="esave">Salva spesa</button></div></section>';
  var list=state.expenses.slice().sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0)});
  var st=sumExp(list),mk=t.slice(0,7),sm=sumExp(list.filter(function(x){return x.date.indexOf(mk)===0}));
  var by={};list.forEach(function(x){var c=x.cat||'Senza categoria';by[c]=(by[c]||0)+x.amount});
  var catRows=Object.keys(by).sort(function(a,b){return by[b]-by[a]}).map(function(c){return '<div class="row"><span>'+esc(c)+'</span><b>'+eur(by[c])+'</b></div>'}).join('');
  var totals='<section class="card" aria-label="Totale spese"><div class="card-h"><h2>Totale spese</h2><span>'+list.length+(list.length===1?' voce':' voci')+'</span></div>'
   +'<div class="stats exp"><div class="stat"><b>'+eur(st.tot)+'</b><span>totale</span></div><div class="stat"><b>'+eur(st.bill)+'</b><span>da fatturare</span></div><div class="stat"><b>'+eur(sm.tot)+'</b><span>questo mese</span></div></div>'+catRows
   +'<div class="actions"><button class="btn alt" data-a="expsummary">Riepilogo e CSV</button></div></section>';
  var groups='',cur='';
  list.forEach(function(x){
    var k=x.date.slice(0,7);
    if(k!==cur){cur=k;var pp=k.split('-'),ms=sumExp(list.filter(function(y){return y.date.indexOf(k)===0}));groups+='<p class="sub" style="margin-top:6px">'+fmtMonth(+pp[0],+pp[1]-1)+' · '+eur(ms.tot)+'</p>'}
    groups+=expItem(x);
  });
  var listHtml=list.length?'<div class="list">'+groups+'</div>':'<div class="empty">Nessuna spesa registrata.<br>Compila il modulo qui sopra per aggiungere la prima.</div>';
  return form+totals+listHtml;
}
function expenseModal(){
  var x=ui.xf;
  return '<div class="scrim" data-scrim="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Modifica spesa"><h2>Modifica spesa</h2>'
   +'<div class="two"><div class="field"><label for="x-date">Giorno</label><input id="x-date" type="date" data-x="date" value="'+x.date+'"></div><div class="field"><label for="x-amt">Importo (€)</label><input id="x-amt" type="text" inputmode="decimal" data-x="amount" value="'+esc(x.amount)+'"></div></div>'
   +'<div class="field"><label>Categoria</label>'+catChips(x.cat,'xcat')+'</div>'
   +'<div class="field"><label for="x-desc">Descrizione</label><input id="x-desc" type="text" data-x="desc" value="'+esc(x.desc)+'"></div>'
   +'<div class="presets"><button type="button" class="chip" data-a="xbill" aria-pressed="'+x.bill+'">Da fatturare a Massini</button></div>'
   +'<div class="actions"><button class="btn del" data-a="xdel">'+(ui.confirmDel?'Conferma eliminazione':'Elimina')+'</button><button class="btn alt" data-a="close">Annulla</button><button class="btn" data-a="xsave">Salva</button></div></div></div>';
}
function expSummaryText(){
  var list=state.expenses.slice().sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0)}),out=['CONSULENZA MASSINI · Registro spese',''];
  var months={};list.forEach(function(x){(months[x.date.slice(0,7)]=months[x.date.slice(0,7)]||[]).push(x)});
  Object.keys(months).sort().forEach(function(k){
    var pp=k.split('-');out.push(fmtMonth(+pp[0],+pp[1]-1).toUpperCase());
    months[k].forEach(function(x){out.push(fmtIt(x.date)+' · '+(x.cat||'Senza categoria')+(x.desc?' · '+x.desc:'')+' · '+eur(x.amount)+(x.bill?' · da fatturare':''))});
    out.push('Totale mese: '+eur(sumExp(months[k]).tot),'');
  });
  var st=sumExp(list);out.push('TOTALE: '+eur(st.tot)+' · di cui da fatturare: '+eur(st.bill));
  return out.join('\n');
}
function expCsv(){
  function q(v){return '"'+String(v).replace(/"/g,'""')+'"'}
  var rows=[['Data','Categoria','Descrizione','Importo','Da fatturare'].map(q).join(';')];
  state.expenses.slice().sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0)}).forEach(function(x){rows.push([fmtIt(x.date),x.cat||'',x.desc||'',x.amount.toFixed(2).replace('.',','),x.bill?'sì':'no'].map(q).join(';'))});
  return '\ufeff'+rows.join('\r\n');
}
function expSummaryModal(){
  return '<div class="scrim" data-scrim="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Riepilogo spese"><h2>Riepilogo spese</h2>'
   +'<p class="hint">Testo pronto da incollare in una mail o in fattura.</p>'
   +'<textarea class="out" id="out" readonly aria-label="Riepilogo spese">'+esc(expSummaryText())+'</textarea>'
   +'<div class="actions"><button class="btn alt" data-a="close">Chiudi</button><button class="btn alt" data-a="csv">Scarica CSV</button><button class="btn" data-a="copy">Copia testo</button></div></div></div>';
}
function defaultSite(){
  var s=state.settings.sites;if(!s.length)return '';
  var last=sorted(state.entries.filter(function(e){return e.type==='sede'&&e.site})).pop();
  if(last&&s.some(function(x){return x.name===last.site}))return last.site;
  return s[0].name;
}
function siteSelect(id,attr,cur){
  var s=state.settings.sites;if(!s.length)return '';
  var opts=s.map(function(x){return '<option value="'+esc(x.name)+'"'+(cur===x.name?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'<option value=""'+(cur===''?' selected':'')+'>Altra sede</option>';
  return '<div class="field"><label for="'+id+'">Sede</label><select id="'+id+'" '+attr+'>'+opts+'</select></div>';
}
function defaultsFor(type){
  var last=sorted(state.entries.filter(function(e){return e.type===type})).pop();
  return last?{start:last.start,end:last.end,pause:last.pause||0}:{start:'09:00',end:'18:00',pause:60};
}
function newQ(type){
  type=type||(sorted(state.entries).pop()||{}).type||'sede';
  var d=defaultsFor(type);
  return {type:type,date:todayIso(),start:d.start,end:d.end,pause:d.pause,note:'',tags:[],site:defaultSite()};
}
function itemHTML(e,withMonth){
  var d=parse(e.date);
  return '<button class="item '+e.type+'" data-a="edit" data-id="'+e.id+'"><div class="dnum"><b>'+d.getDate()+'</b><span>'+wd(e.date)+'</span></div>'
   +'<div class="t"><span><span class="pill '+e.type+'">'+TYPE[e.type]+(e.type==='sede'&&e.site?' · '+esc(e.site):'')+'</span></span><span class="when">'+e.start+' – '+e.end+(e.end<e.start?' (+1)':'')+(e.pause?' · pausa '+e.pause+' min':'')+(withMonth?' · '+fmtShortMonth(e.date):'')+'</span>'+((e.tags&&e.tags.length)?'<span class="tags">'+e.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+'</span>':'')
   +(e.note?'<span class="note">'+esc(e.note)+'</span>':'')
   +((e.gin||e.gout)?'<span class="note geo'+(((e.gin&&e.gin.site)||(e.gout&&e.gout.site))?' ok':'')+'">Posizione · entrata: '+(e.gin?geoWord(e.gin):'n.d.')+' · uscita: '+(e.gout?geoWord(e.gout):'n.d.')+'</span>':'')+'</div>'
   +'<div class="h">'+fmtH(mins(e))+'</div></button>';
}
function quickForm(){
  var q=ui.q,t=todayIso(),y=addDays(t,-1);
  var seg=['sede','smart'].map(function(k){return '<button type="button" class="'+k+'" data-a="qtype" data-v="'+k+'" aria-pressed="'+(q.type===k)+'">'+ICON[k]+TYPE[k]+'</button>'}).join('');
  var pauses=[0,15,30,45,60,90].map(function(p){return '<option value="'+p+'"'+(+q.pause===p?' selected':'')+'>'+(p?p+' min':'Nessuna')+'</option>'}).join('');
  var presets=[['day','Giornata 9–18'],['am','Mattina 9–13'],['pm','Pomeriggio 14–18'],['night','Serata 20–24']].map(function(p){return '<button type="button" class="chip" data-a="qpreset" data-v="'+p[0]+'">'+p[1]+'</button>'}).join('');
  var quando='<div class="fblock"><p class="sub">Quando</p><div class="qrow"><div class="presets"><button type="button" class="chip" data-a="qdate" data-v="'+t+'" aria-pressed="'+(q.date===t)+'">Oggi</button><button type="button" class="chip" data-a="qdate" data-v="'+y+'" aria-pressed="'+(q.date===y)+'">Ieri</button></div>'
   +'<input id="q-date" type="date" data-q="date" aria-label="Giorno" value="'+q.date+'"></div></div>';
  var dove=q.type==='sede'?(siteSelect('q-site','data-q="site"',q.site)?'<div class="fblock"><p class="sub">Dove</p>'+siteSelect('q-site','data-q="site"',q.site)+'</div>':''):'';

/* Gli obiettivi si contano a settimane intere (lunedì-domenica) dentro il periodo. */
function nextMonday(s){var d=parse(s);d.setDate(d.getDate()+(8-d.getDay())%7);return iso(d)}
function effStart(){return nextMonday(state.settings.startDate)}
function periodWeeks(){var e=state.settings.endDate,m=effStart(),out=[];while(addDays(m,6)<=e){out.push(m);m=addDays(m,7)}if(!out.length)out.push(effStart());return out}
function easterDate(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),dd=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,dd)}
/* Giorni non lavorativi: festività nazionali, Pasquetta e giorni extra scelti in Impostazioni. */
function offDays(){
  var s=state.settings,set={},y1=+s.startDate.slice(0,4),y2=+s.endDate.slice(0,4);
  var fixed=[[1,1],[1,6],[4,25],[5,1],[6,2],[8,15],[11,1],[12,8],[12,25],[12,26]];
  for(var y=y1;y<=y2;y++){
    fixed.forEach(function(d){set[y+'-'+pad(d[0])+'-'+pad(d[1])]=1});
    var ea=easterDate(y);set[iso(new Date(ea.getFullYear(),ea.getMonth(),ea.getDate()+1))]=1;
  }
  (s.offs||[]).forEach(function(x){set[x]=1});
  return set;
}
/* Quota di una settimana: 1 per giorno lavorativo su 5. Una festività in settimana riduce la quota di 1/5. */
function weekFactor(mon,off){var n=0;for(var i=0;i<5;i++){if(!off[addDays(mon,i)])n++}return n/5}
function weekProgress(){
  var off=offDays(),ws=periodWeeks(),t=todayIso(),started=0,done=0,sw=0,dw=0,tw=0;
  ws.forEach(function(m){var f=weekFactor(m,off),end=addDays(m,6);tw+=f;if(m<=t){started++;sw+=f}if(end<t){done++;dw+=f}});
  return {weeks:ws,started:started,done:done,total:ws.length,wStarted:sw,wDone:dw,wTotal:tw,off:off};
}
function typeStatus(act,target,wp){
  var dueDone=target*wp.wDone,dueNow=target*wp.wStarted;
  if(!target)return {c:'neu',t:'Nessun obiettivo',note:''};
  if(wp.started===0)return {c:'neu',t:'Non ancora iniziato',note:''};
  if(act<dueDone-0.001)return {c:'warn',t:'Indietro di '+gg(Math.ceil(dueDone-act-0.001)),note:''};
  if(act>dueNow+0.001)return {c:'ok',t:'Avanti di '+gg(Math.floor(act-dueNow+0.001)),note:''};
  if(act>=dueNow-0.001)return {c:'ok',t:'In regola',note:''};
  return {c:'ok',t:'In linea',note:'questa settimana ne mancano '+num(dueNow-act)};
}

function weekStats(mon){var sun=addDays(mon,6),st=stats(state.entries.filter(function(e){return e.date>=mon&&e.date<=sun}));return {mon:mon,sd:st.sede.days,sm:st.smart.days}}
function allMonthKeys(){var set={};monthKeys().forEach(function(k){set[k]=1});state.expenses.forEach(function(x){set[x.date.slice(0,7)]=1});return Object.keys(set).sort()}

function typeStatus(act,target,wp){
  var dueDone=target*wp.done,dueNow=target*wp.started;
  if(!target)return {c:'neu',t:'Nessun obiettivo',note:''};
  if(wp.started===0)return {c:'neu',t:'Non ancora iniziato',note:''};
  if(act<dueDone)return {c:'warn',t:'Indietro di '+gg(dueDone-act),note:''};
  if(act>dueNow)return {c:'ok',t:'Avanti di '+gg(act-dueNow),note:''};
  if(act===dueNow)return {c:'ok',t:'In regola',note:''};
  return {c:'ok',t:'In linea',note:'questa settimana ne manca '+(dueNow-act)};
}
function goalRow(type,act,target,wp){
  var st=typeStatus(act,target,wp),endT=target*wp.wTotal;
  var pct=endT?Math.min(100,act/endT*100):0,mk=endT?Math.min(100,target*wp.wStarted/endT*100):0;
  return '<div class="goal"><div class="row"><div class="lab '+type+'">'+ICON[type]+TYPE[type]+'</div><span class="pill '+st.c+'">'+st.t+'</span></div>'
   +'<div class="gbar"><i class="'+type+'" style="width:'+pct.toFixed(1)+'%"></i>'+(mk>0&&mk<100?'<u style="left:'+mk.toFixed(1)+'%"></u>':'')+'</div>'
   +'<p class="hint"><b>'+act+'</b> su '+num(endT)+' nel periodo · previste finora '+num(target*wp.wStarted)+(st.note?' · '+st.note:'')+'</p></div>';
}
function statusCard(){
  var s=state.settings,wp=weekProgress();
  var st=stats(state.entries.filter(function(x){return x.date>=s.startDate&&x.date<=s.endDate}));
  var dueDoneS=s.targetSede*wp.wDone,dueDoneM=s.targetSmart*wp.wDone,dueNowS=s.targetSede*wp.wStarted,dueNowM=s.targetSmart*wp.wStarted;
  var behindS=Math.max(0,Math.ceil(dueDoneS-st.sede.days-0.001)),behindM=Math.max(0,Math.ceil(dueDoneM-st.smart.days-0.001)),hero;
  if(wp.started===0){hero={c:'neu',t:'Il pilota non è ancora iniziato',s:'Gli obiettivi si contano da '+dayLong(effStart())+'.'}}
  else if(behindS||behindM){
    var parts=[];if(behindS)parts.push(gg(behindS)+' in sede');if(behindM)parts.push(gg(behindM)+' smart');
    hero={c:'warn',t:'Sei indietro',s:'Rispetto alle settimane già concluse ti mancano '+parts.join(' e ')+'.'};
  }else{
    hero={c:'ok',t:'Sei in linea con gli obiettivi',s:'Hai fatto '+gg(st.sede.days)+' in sede e '+gg(st.smart.days)+' smart. Previste entro questa settimana: '+num(dueNowS)+' e '+num(dueNowM)+'.'};
  }
  var endS=s.targetSede*wp.wTotal,endM=s.targetSmart*wp.wTotal;
  var left='Per chiudere il periodo mancano '+gg(Math.max(0,Math.ceil(endS-st.sede.days-0.001)))+' in sede e '+gg(Math.max(0,Math.ceil(endM-st.smart.days-0.001)))+' smart.';
  var head=wp.started===0?'Parte lunedì '+shortDay(effStart()):(wp.done>=wp.total?'Periodo concluso':'Settimana '+wp.started+' di '+wp.total);
  return '<section class="card"><div class="card-h"><h2>Obiettivi del periodo</h2><span>'+head+'</span></div>'
   +'<div class="hero '+hero.c+'"><b>'+hero.t+'</b><span>'+hero.s+'</span></div>'
   +goalRow('sede',st.sede.days,s.targetSede,wp)+goalRow('smart',st.smart.days,s.targetSmart,wp)
   +'<p class="hint">'+left+' La linea scura sulle barre indica dove dovresti essere oggi. Le settimane vanno da lunedì a domenica.</p></section>';
}

function svgWeeks(wp){
  var s=state.settings,tgt=s.targetSede+s.targetSmart,ws=wp.weeks,n=ws.length,t=todayIso(),data=ws.map(weekStats);
  var W=320,H=190,pl=26,pr=6,pt=22,pb=26,ph=H-pt-pb,pw=W-pl-pr,bw=pw/n,bar=Math.min(20,bw*0.62);
  var mx=Math.max(tgt,1);data.forEach(function(w){mx=Math.max(mx,w.sd+w.sm)});mx=Math.ceil(mx);
  var Y=function(v){return pt+ph-v/mx*ph},step=mx>6?2:1;
  var o='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Giornate per settimana" style="width:100%;height:auto">';
  for(var v=0;v<=mx;v+=step)o+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="axis" x="'+(pl-6)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'+v+'</text>';
  data.forEach(function(w,i){
    var x=pl+i*bw+(bw-bar)/2,cx=(x+bar/2).toFixed(1),cur=w.mon<=t&&addDays(w.mon,6)>=t,y0=Y(0),hs=w.sd/mx*ph,hm=w.sm/mx*ph;
    if(cur)o+='<rect class="curcol" x="'+(pl+i*bw+1).toFixed(1)+'" y="'+(pt-4)+'" width="'+(bw-2).toFixed(1)+'" height="'+(ph+8)+'" rx="6"/>';
    if(w.sd)o+='<rect class="bar-sede" x="'+x.toFixed(1)+'" y="'+(y0-hs).toFixed(1)+'" width="'+bar.toFixed(1)+'" height="'+hs.toFixed(1)+'" rx="4"/>';
    if(w.sm)o+='<rect class="bar-smart" x="'+x.toFixed(1)+'" y="'+(y0-hs-hm).toFixed(1)+'" width="'+bar.toFixed(1)+'" height="'+hm.toFixed(1)+'" rx="4"/>';
    if(w.sd+w.sm)o+='<text class="axis val" x="'+cx+'" y="'+(y0-hs-hm-5).toFixed(1)+'" text-anchor="middle">'+(w.sd+w.sm)+'</text>';
    o+='<text class="axis'+(cur?' cur':'')+'" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">S'+(i+1)+'</text>';
  });
  o+='<line class="tline" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(tgt).toFixed(1)+'" y2="'+Y(tgt).toFixed(1)+'"/>';
  o+='<text class="axis tlab" x="'+(W-pr)+'" y="'+(Y(tgt)-5).toFixed(1)+'" text-anchor="end">obiettivo '+tgt+'</text>';
  return o+'</svg>';
}
function svgCum(wp){
  var s=state.settings,t=todayIso(),st=effStart(),keys=dayKeys(st,s.endDate),N=keys.length;
  if(N<2)return emptyNote('Il periodo è troppo breve per questo grafico.');
  var W=320,H=214,pl=26,pr=40,pt=16,pb=24,pw=W-pl-pr,ph=H-pt-pb;
  var endS=s.targetSede*wp.wTotal,endM=s.targetSmart*wp.wTotal,mx=Math.max(1,Math.ceil(Math.max(endS,endM)));
  var dm=dayMaps(),li=t<st?-1:(t>s.endDate?N-1:keys.indexOf(t));
  var X=function(i){return pl+i/(N-1)*pw},Y=function(v){return pt+ph-v/mx*ph};
  var pre={sd:{},sm:{}};state.entries.forEach(function(e){if(e.date>=s.startDate&&e.date<st){(e.type==='sede'?pre.sd:pre.sm)[e.date]=1}});
  var cs=Object.keys(pre.sd).length,cm=Object.keys(pre.sm).length;
  var o='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Andamento nel periodo" style="width:100%;height:auto">';
  var ticks=[0,Math.round(mx/2),mx].filter(function(v,i,a){return a.indexOf(v)===i});
  ticks.forEach(function(v){o+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="axis" x="'+(pl-6)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'+v+'</text>'});
  var ps=[],pm=[],es=[],em=[],lastS=0,lastM=0,eS=0,eM=0;
  keys.forEach(function(k,i){
    var wd=parse(k).getDay(),work=wd>0&&wd<6&&!wp.off[k];if(work){eS+=s.targetSede/5;eM+=s.targetSmart/5}
    if(dm.sd[k]&&k>=st)cs++;if(dm.sm[k]&&k>=st)cm++;
    if(i<=li){ps.push(X(i).toFixed(1)+','+Y(cs).toFixed(1));pm.push(X(i).toFixed(1)+','+Y(cm).toFixed(1));lastS=cs;lastM=cm}
    es.push(X(i).toFixed(1)+','+Y(eS).toFixed(1));em.push(X(i).toFixed(1)+','+Y(eM).toFixed(1));
    if(i===0)o+='<text class="axis" x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="start">'+shortDay(k)+'</text>';
    else if(k.slice(8)==='01'&&i>=7&&i<=N-8)o+='<text class="axis" x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+monthShort(k.slice(0,7))+'</text>';
    else if(i===N-1)o+='<text class="axis" x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="end">'+shortDay(k)+'</text>';
  });
  if(li>0&&li<N-1)o+='<line class="todayline" x1="'+X(li).toFixed(1)+'" x2="'+X(li).toFixed(1)+'" y1="'+pt+'" y2="'+(pt+ph)+'"/><text class="axis cur" x="'+X(li).toFixed(1)+'" y="'+(pt-4)+'" text-anchor="middle">oggi</text>';
  o+='<polyline class="lexp sede" points="'+es.join(' ')+'"/><polyline class="lexp smart" points="'+em.join(' ')+'"/>';
  if(ps.length){
    o+='<polyline class="lsede" points="'+ps.join(' ')+'"/><polyline class="lsmart" points="'+pm.join(' ')+'"/>';
    o+='<circle class="pt-sede" cx="'+X(li).toFixed(1)+'" cy="'+Y(lastS).toFixed(1)+'" r="5"/><circle class="pt-smart" cx="'+X(li).toFixed(1)+'" cy="'+Y(lastM).toFixed(1)+'" r="5"/>';
  }
  if(endS===endM)o+='<text class="axis tlab" x="'+(W-pr+5)+'" y="'+(Y(endS)+3).toFixed(1)+'">'+num(endS)+'</text>';
  else{o+='<text class="axis tlab" x="'+(W-pr+5)+'" y="'+(Y(endS)+3).toFixed(1)+'">'+num(endS)+'</text><text class="axis tlab" x="'+(W-pr+5)+'" y="'+(Y(endM)+3).toFixed(1)+'">'+num(endM)+'</text>'}
  return o+'</svg>';
}
function svgMonths(){
  if(!state.expenses.length)return emptyNote('Nessuna spesa registrata. Aggiungila dalla scheda Spese.');
  var keys=allMonthKeys(),data=keys.map(function(k){var z=sumExp(state.expenses.filter(function(x){return x.date.indexOf(k)===0}));return {k:k,tot:z.tot,bill:z.bill}});
  var W=320,H=180,pl=8,pr=8,pt=20,pb=24,pw=W-pl-pr,ph=H-pt-pb,n=data.length,mx=Math.max(1,Math.max.apply(null,data.map(function(d){return d.tot})));
  var bw=pw/n,bar=Math.min(44,bw*0.5),o='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Spese per mese" style="width:100%;height:auto">';
  o+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(pt+ph)+'" y2="'+(pt+ph)+'"/>';
  data.forEach(function(d,i){
    var x=pl+i*bw+(bw-bar)/2,ht=d.tot/mx*ph,hb=d.bill/mx*ph,yb=pt+ph,cx=(x+bar/2).toFixed(1);
    if(d.tot)o+='<rect class="bar-tot" x="'+x.toFixed(1)+'" y="'+(yb-ht).toFixed(1)+'" width="'+bar.toFixed(1)+'" height="'+ht.toFixed(1)+'" rx="6"/>';
    if(d.bill)o+='<rect class="bar-bill" x="'+x.toFixed(1)+'" y="'+(yb-hb).toFixed(1)+'" width="'+bar.toFixed(1)+'" height="'+hb.toFixed(1)+'" rx="6"/>';
    if(d.tot)o+='<text class="axis val" x="'+cx+'" y="'+(yb-ht-6).toFixed(1)+'" text-anchor="middle">'+eur(d.tot).replace(/,00/,'')+'</text>';
    o+='<text class="axis" x="'+cx+'" y="'+(H-7)+'" text-anchor="middle">'+monthShort(d.k)+'</text>';
  });
  return o+'</svg>';
}
function catBars(){
  if(!state.expenses.length)return emptyNote('Nessuna spesa registrata.');
  var by={},tot=0;state.expenses.forEach(function(x){var c=x.cat||'Senza categoria';by[c]=(by[c]||0)+x.amount;tot+=x.amount});
  var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]}),mx=by[ks[0]];
  return '<div class="catlist">'+ks.map(function(c){return '<div class="catrow"><span class="catname">'+esc(c)+'</span><div class="catbar"><i style="width:'+(by[c]/mx*100).toFixed(1)+'%"></i></div><b>'+eur(by[c])+'<small>'+Math.round(by[c]/tot*100)+'%</small></b></div>'}).join('')+'</div>';
}
function andamentoPage(){

  var leg='<div class="legend"><span><i class="dot sede"></i>In sede</span><span><i class="dot smart"></i>Smart working</span></div>';

   +'<section class="card"><div class="card-h"><h2>Giornate per settimana</h2><span>S1 parte lunedì '+shortDay(wp.weeks[0])+'</span></div>'
   +svgWeeks(wp)+leg+'<p class="hint">Ogni barra è una settimana. La linea tratteggiata è l’obiettivo: '+gg(tgt)+' a settimana ('+s.targetSede+' in sede e '+s.targetSmart+' smart).</p>'+none+'</section>'
   +'<section class="card"><div class="card-h"><h2>Andamento nel periodo</h2><span>giornate sommate</span></div>'
   +svgCum(wp)+leg+'<p class="hint">Linea piena: giornate fatte. Tratteggio: ritmo previsto, fino a fine periodo.</p></section>'
   +'<section class="card"><div class="card-h"><h2>Spese per mese</h2><span>'+eur(ex.tot)+' in tutto</span></div>'
   +svgMonths()+(state.expenses.length?'<div class="legend"><span><i class="dot" style="background:var(--sede);opacity:.3"></i>Totale del mese</span><span><i class="dot" style="background:var(--sede)"></i>Da fatturare ('+eur(ex.bill)+')</span></div>':'')+'</section>'
   +'<section class="card"><div class="card-h"><h2>Spese per categoria</h2><span>% sul totale</span></div>'+catBars()+'</section>';

/* ---------- salvataggio (solo su questo dispositivo) ---------- */
function persist(msg){
  state.updated=Date.now();
  var ok=true;
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){ok=false}
  toast(ok?msg:'Non riesco a salvare su questo dispositivo',ok?2200:4000);
  draw();
}
function downloadCsv(kind){
  var fn=kind==='exp'?'spese-massini.csv':'consulenza-massini.csv';
  try{
    var blob=new Blob([kind==='exp'?expCsv():csvText()],{type:'text/csv;charset=utf-8'});
    var f=new File([blob],fn,{type:'text/csv'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return}
    var u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},4000);
  }catch(e){toast('Download non disponibile')}
}
function backupShare(){
  var txt=JSON.stringify(state),name='backup-massini-'+todayIso()+'.json';
  try{
    var f=new File([txt],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Backup Consulenza Massini'}).catch(function(){});return}
    if(navigator.share){navigator.share({title:'Backup Consulenza Massini',text:txt}).catch(function(){});return}
  }catch(e){}
  backupCopy();
}
function backupCopy(){
  var ta=document.getElementById('s-bk'),txt=JSON.stringify(state);
  function fb(){ta.value=txt;ta.focus();ta.select();toast('Copia a mano il testo qui sopra')}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('Backup copiato')}).catch(fb)}else{fb()}
}
function backupRestore(){
  var ta=document.getElementById('s-bk');
  try{
    var b=JSON.parse(ta.value);
    if(!b||!Array.isArray(b.entries)||!b.settings)throw 0;
    state=b;normState();ui.modal=null;ui.view=initialView();persist('Backup ripristinato');
  }catch(e){toast('Il testo incollato non è un backup valido',3500)}
}

/* ---------- azioni ---------- */
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function openForm(type,date,entry){
  ui.confirmDel=false;
  if(entry){ui.form={id:entry.id,type:entry.type,date:entry.date,start:entry.start,end:entry.end,pause:entry.pause||0,note:entry.note||'',tags:(entry.tags||[]).slice(),site:entry.site||'',gin:entry.gin||null,gout:entry.gout||null}}
  else{
    var last=sorted(state.entries.filter(function(e){return e.type===type})).pop();
    ui.form={id:null,type:type,date:date||todayIso(),start:last?last.start:'09:00',end:last?last.end:'18:00',pause:last?(last.pause||0):60,note:'',tags:[],site:defaultSite()};
  }
  ui.modal='form';draw();
}
var PRESET={day:['09:00','18:00',60],am:['09:00','13:00',0],pm:['14:00','18:00',0],night:['20:00','00:00',0]};

function onClick(e){
  var scr=e.target.closest('[data-scrim]');
  if(scr&&e.target===scr){ui.modal=null;draw();return}
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,id=el.dataset.id;
  if(a==='add'){var d=el.dataset.date;var ty=el.dataset.type;
    if(d&&!ty){var prev=ui.form&&ui.form.type;ty=prev||'sede'}
    openForm(ty,d)}
  else if(a==='edit'){var en=state.entries.filter(function(x){return x.id===id})[0];if(en)openForm(en.type,en.date,en)}
  else if(a==='close'){ui.modal=null;draw()}
  else if(a==='settype'){ui.form.type=el.dataset.v;draw()}
  else if(a==='preset'){var p=PRESET[el.dataset.v];ui.form.start=p[0];ui.form.end=p[1];ui.form.pause=p[2];draw()}
  else if(a==='saveentry'){saveEntry()}
  else if(a==='del'){
    if(!ui.confirmDel){ui.confirmDel=true;draw();return}
    state.entries=state.entries.filter(function(x){return x.id!==ui.form.id});
    ui.modal=null;persist('Giornata eliminata');
  }
  else if(a==='prev'){ui.view.m--;if(ui.view.m<0){ui.view.m=11;ui.view.y--}draw()}
  else if(a==='next'){ui.view.m++;if(ui.view.m>11){ui.view.m=0;ui.view.y++}draw()}
  else if(a==='thismonth'){ui.view=initialView();draw()}
  else if(a==='filter'){ui.filter=el.dataset.v;draw()}
  else if(a==='summary'){ui.modal='summary';draw()}
  else if(a==='settings'){ui.sform=JSON.parse(JSON.stringify(state.settings));ui.sform.tagsText=state.settings.tags.join(', ');ui.sform.catsText=state.settings.cats.join(', ');ui.sform.offsText=(state.settings.offs||[]).join(', ');ui.modal='settings';draw()}
  else if(a==='savesettings'){saveSettings()}
  else if(a==='copy'){copyText()}
  else if(a==='setmode'){ui.mode=el.dataset.v;state.mode=ui.mode;try{localStorage.setItem(LS,JSON.stringify(state))}catch(x){}draw()}
  else if(a==='qtype'){var dd=defaultsFor(el.dataset.v);ui.q.type=el.dataset.v;ui.q.start=dd.start;ui.q.end=dd.end;ui.q.pause=dd.pause;draw()}
  else if(a==='qdate'){ui.q.date=el.dataset.v;draw()}
  else if(a==='qpreset'){var pp=PRESET[el.dataset.v];ui.q.start=pp[0];ui.q.end=pp[1];ui.q.pause=pp[2];draw()}
  else if(a==='qsave'){saveQuick()}
  else if(a==='qtag'){toggleTag(ui.q.tags,el.dataset.v);draw()}
  else if(a==='ftag'){toggleTag(ui.form.tags,el.dataset.v);draw()}
  else if(a==='clockin'){var n=new Date();var ts=n.getTime();state.active={type:el.dataset.type,date:iso(n),start:nowHM(),ts:ts,gin:null,gpend:true};ui.confirmDiscard=false;persist('Entrata timbrata alle '+state.active.start);locate(ts)}
  else if(a==='clockout'){var ac=state.active;if(!ac)return;ui.confirmDel=false;var fm=ui.form={id:null,type:ac.type,date:ac.date,start:ac.start,end:nowHM(),pause:0,note:'',fromClock:true,tags:[],site:(ac.gin&&ac.gin.site)||defaultSite(),gin:ac.gin||null,gout:null,gpend:true};ui.modal='form';draw();getPos().then(function(g){if(ui.form!==fm)return;if(g&&g.err){fm.gerr=g.err}else{fm.gout=tagSite(g)}fm.gpend=false;var gl=document.getElementById('gline');if(gl)gl.innerHTML=geoFormLine(fm)})}
  else if(a==='discard'){if(!ui.confirmDiscard){ui.confirmDiscard=true;draw();return}ui.confirmDiscard=false;state.active=null;persist('Sessione scartata')}
  else if(a==='csv'){downloadCsv(ui.modal==='expsummary'?'exp':'')}
  else if(a==='setpage'){ui.page=el.dataset.v;state.page=ui.page;saveQuiet();draw();window.scrollTo(0,0)}
  else if(a==='edate'){ui.e.date=el.dataset.v;draw()}
  else if(a==='ecat'){ui.e.cat=el.dataset.v;draw()}
  else if(a==='ebill'){ui.e.bill=!ui.e.bill;draw()}
  else if(a==='esave'){saveExpense()}
  else if(a==='eedit'){var ex=state.expenses.filter(function(z){return z.id===id})[0];if(ex){ui.confirmDel=false;ui.xf={id:ex.id,date:ex.date,amount:String(ex.amount).replace('.',','),cat:ex.cat,desc:ex.desc||'',bill:!!ex.bill};ui.modal='expense';draw()}}
  else if(a==='xcat'){ui.xf.cat=el.dataset.v;draw()}
  else if(a==='xbill'){ui.xf.bill=!ui.xf.bill;draw()}
  else if(a==='xsave'){saveExpEdit()}
  else if(a==='xdel'){
    if(!ui.confirmDel){ui.confirmDel=true;draw();return}
    state.expenses=state.expenses.filter(function(z){return z.id!==ui.xf.id});ui.modal=null;ui.confirmDel=false;persist('Spesa eliminata');
  }
  else if(a==='expsummary'){ui.modal='expsummary';draw()}
  else if(a==='siteadd'){addSite()}
  else if(a==='geotest'){geoTest()}
  else if(a==='georetry'){var ac2=state.active;if(!ac2)return;ac2.gpend=true;draw();locate(ac2.ts)}
  else if(a==='siterm'){ui.sform.sites.splice(+el.dataset.i,1);draw()}
  else if(a==='bkshare'){backupShare()}
  else if(a==='bkcopy'){backupCopy()}
  else if(a==='bkrestore'){backupRestore()}
}
function saveEntry(){
  var f=ui.form;
  if(!f.date){toast('Scegli il giorno');return}
  var net=span(f.start,f.end)-(+f.pause||0);
  if(!f.start||!f.end||net<=0){toast('Controlla orari e pausa');return}
  var rec={id:f.id||newId(),type:f.type,date:f.date,start:f.start,end:f.end,pause:+f.pause||0,note:f.note.trim()};
  if(f.type==='sede'&&f.site)rec.site=f.site;
  if(f.tags&&f.tags.length)rec.tags=f.tags.slice();
  if(f.gin)rec.gin=f.gin;if(f.gout)rec.gout=f.gout;
  if(f.id){state.entries=state.entries.map(function(x){return x.id===f.id?rec:x})}else{state.entries.push(rec)}
  if(f.fromClock)state.active=null;
  var d=parse(f.date);ui.view={y:d.getFullYear(),m:d.getMonth()};
  ui.modal=null;persist(f.fromClock?'Uscita timbrata, giornata salvata':'Giornata salvata');
}
function saveQuick(){
  var q=ui.q;
  if(!q.date){toast('Scegli il giorno');return}
  var net=span(q.start,q.end)-(+q.pause||0);
  if(!q.start||!q.end||net<=0){toast('Controlla orari e pausa');return}
  var qr={id:newId(),type:q.type,date:q.date,start:q.start,end:q.end,pause:+q.pause||0,note:q.note.trim()};if(q.type==='sede'&&q.site)qr.site=q.site;if(q.tags.length)qr.tags=q.tags.slice();state.entries.push(qr);
  var d=parse(q.date);ui.view={y:d.getFullYear(),m:d.getMonth()};
  ui.q.note='';ui.q.tags=[];
  persist('Giornata salvata: '+fmtH(net));
}
function locate(ts){
  getPos().then(function(g){
    var a=state.active;if(!a||a.ts!==ts)return;
    if(g&&g.err){a.gin=null;a.gerr=g.err}else{a.gin=tagSite(g);a.gerr=null}
    a.gpend=false;saveQuiet();
    var gs=geoStatus(a);toast(gs.t.replace('✓ ',''),4000);
    if(!ui.modal)draw();
  });
}
function geoTest(){
  var out=document.getElementById('geotest');if(out)out.textContent='Cerco la posizione…';
  getPos().then(function(g){
    var o=document.getElementById('geotest');if(!o)return;
    if(g.err){o.textContent=geoStatus({gerr:g.err}).t;return}
    tagSite(g);
    o.textContent=g.site?'✓ Sei in sede: '+g.site+' (a '+fmtDist(g.d)+', precisione '+g.ac+' m)':(state.settings.sites.length?'Fuori sede. La più vicina è '+g.near+', a '+fmtDist(g.d)+' (precisione '+g.ac+' m)':'Posizione rilevata, ma non hai sedi salvate');
  });
}
function addSite(){
  var name=document.getElementById('s-sname').value.trim(),co=document.getElementById('s-scoord').value.trim();
  if(!name){toast('Dai un nome alla sede');return}
  function push(la,lo){ui.sform.sites.push({name:name,lat:la,lng:lo});draw();toast('Sede aggiunta. Ricorda di salvare.')}
  var m=co.match(/(-?\d+[.,]\d+)\s*[,;\s]\s*(-?\d+[.,]\d+)/);
  if(m){push(parseFloat(m[1].replace(',','.')),parseFloat(m[2].replace(',','.')));return}
  if(co){toast('Coordinate non riconosciute. Esempio: 43.0707, 12.6196',3500);return}
  toast('Cerco la posizione…',8000);
  getPos().then(function(g){if(!g){toast('Posizione non disponibile: controlla il permesso',3500);return}push(g.la,g.lo)});
}
function saveExpense(){
  var e=ui.e,n=parseAmt(e.amount);
  if(!e.date){toast('Scegli il giorno');return}
  if(!(n>0)){toast('Inserisci un importo valido');return}
  state.expenses.push({id:newId(),date:e.date,amount:n,cat:e.cat,desc:e.desc.trim(),bill:!!e.bill});
  ui.e={date:e.date,amount:'',cat:e.cat,desc:'',bill:false};
  persist('Spesa salvata: '+eur(n));
}
function saveExpEdit(){
  var x=ui.xf,n=parseAmt(x.amount);
  if(!x.date){toast('Scegli il giorno');return}
  if(!(n>0)){toast('Inserisci un importo valido');return}
  state.expenses=state.expenses.map(function(z){return z.id===x.id?{id:x.id,date:x.date,amount:n,cat:x.cat,desc:x.desc.trim(),bill:!!x.bill}:z});
  ui.modal=null;persist('Spesa aggiornata');
}
function saveSettings(){
  var s=ui.sform;
  if(!s.startDate||!s.endDate||s.endDate<s.startDate){toast('Controlla le date del periodo');return}
  state.settings={startDate:s.startDate,endDate:s.endDate,targetSede:Math.max(0,+s.targetSede||0),targetSmart:Math.max(0,+s.targetSmart||0),rate:Math.max(0,+s.rate||0),sites:s.sites||[],sitesInit:true,offs:(String(s.offsText||'').match(/\d{4}-\d{2}-\d{2}/g)||[]),catsInit:true,cats:(function(){var o=[];String(s.catsText||'').split(/[,;\n]/).forEach(function(t){t=t.trim().slice(0,28);if(t&&o.indexOf(t)<0)o.push(t)});return o})(),tagsInit:true,tags:(function(){var o=[];String(s.tagsText||'').split(/[,;\n]/).forEach(function(t){t=t.trim().slice(0,28);if(t&&o.indexOf(t)<0)o.push(t)});return o})(),radius:Math.max(50,+s.radius||250)};
  ui.modal=null;persist('Impostazioni salvate');
}
function copyText(){
  var ta=document.getElementById('out'),txt=ta.value;
  function fallback(){ta.removeAttribute('readonly');ta.focus();ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(x){}ta.setAttribute('readonly','');toast(ok?'Testo copiato':'Seleziona il testo e copialo a mano')}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('Testo copiato')}).catch(fallback)}else{fallback()}
}
function onInput(e){
  var t=e.target;
  if(t.id==='s-bkf'){
    if(e.type!=='change')return;var file=t.files&&t.files[0];if(!file)return;
    var rd=new FileReader();rd.onload=function(){var ta=document.getElementById('s-bk');if(!ta)return;ta.value=String(rd.result);backupRestore()};rd.readAsText(file);return;
  }
  if(t.dataset.e){ui.e[t.dataset.e]=t.value;if(t.dataset.e==='date'&&e.type==='change')draw();return}
  if(t.dataset.x){ui.xf[t.dataset.x]=t.value;return}
  if(t.dataset.q){
    ui.q[t.dataset.q]=t.value;
    if(t.dataset.q==='date'){if(e.type==='change')draw()}
    else{var qd=document.getElementById('qdur');if(qd)qd.innerHTML=durText(ui.q)}
  }
  else if(t.dataset.f){ui.form[t.dataset.f]=t.value;var du=document.getElementById('dur');if(du)du.innerHTML=durText(ui.form)}
  else if(t.dataset.s){ui.sform[t.dataset.s]=t.value}
}

app.addEventListener('click',onClick);
app.addEventListener('input',onInput);
app.addEventListener('change',onInput);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.modal){ui.modal=null;draw()}});

draw();
setInterval(function(){if(!state.active)return;var el=Date.now()-state.active.ts,c=document.getElementById('clock'),r=document.getElementById('ring');if(c)c.textContent=elapsedStr(el);if(r){var C=2*Math.PI*88;r.style.strokeDashoffset=(C*(1-Math.min(1,el/(8*3600e3)))).toFixed(1)}},1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!ui.modal)draw()});

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
